name: Python safety checks
on:
  push:
    branches: [main, fix/release-readiness-2026-11]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pytest>=8" "langgraph>=0.2,<2" "langchain-openai>=0.2" "langchain-core>=0.3"
      - run: python -m compileall -q agents graph.py utils app.py tests
      - run: python -m pytest -q tests/
